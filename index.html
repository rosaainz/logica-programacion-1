<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica Programacion 1</title>
  </head>
  <body>
    <p>Los resultados se ven desde la consola c:</p>
    <script>
      let num1 = parseFloat(prompt("Ingresa el primer numero"));
      let num2 = parseFloat(prompt("Ingresa el segundo numero"));
      let num3 = parseFloat(prompt("Ingresa el tercer numero"));

      console.log("Numeros ingresados: "+ num1 + ', ' + num2 + ', ' + num3);

      let menor, centro, mayor;
      if (num1 == num2 && num1 == num3) {
        console.log("Los tres numeros son iguales");
        mayor = centro = menor = num1;
      } else {
        if (num1 >= num2 && num1 >= num3) {
          mayor = num1;
          if (num2 >= num3) {
            centro = num2;
            menor = num3;
          } else {
            centro = num3;
            menor = num2;
          }
        } else if (num2 >= num1 && num2 >= num3) {
          mayor = num2;
          if (num1 >= num3) {
            centro = num1;
            menor = num3;
          } else {
            centro = num3;
            menor = num1;
          }
        } else {
          mayor = num3;
          if (num1 >= num2) {
            centro = num1;
            menor = num2;
          } else {
            centro = num2;
            menor = num1;
          }
        }
      }
      console.log("Mayor: " + mayor);
      console.log("Centro: " + centro);
      console.log("Menor: " + menor);
      let numeros = [mayor, centro, menor];
      console.log(
        "Ordenados de mayor a menor: " + mayor + ", " + centro + ", " + menor
      );
      console.log(
        "Ordenados de menor a mayor: " + menor + ", " + centro + ", " + mayor
      );
    </script>
  </body>
</html>
